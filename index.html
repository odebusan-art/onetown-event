<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MECHANIC-PC</title>
<script>
  // ===== イベント設定（ここを書き換えれば内容を変更できます） =====
  const CONFIG = {
    password: "s16malove",
    memoTitle: "【管理者（えんどぅ）より緊急メモ】",
    memoText: "ハッカー対策のため、この端末のログインパスワードは端末内には保存していない！パスワードは俺の馴染みがある『Stab City（スタブシティ）』のどこかに手書きメモで隠しておいた。現地でメモを探して入力しろ！",
    errorText: "ACCESS DENIED - パスワードが違います",
    successTitle: "【システム復旧完了】",
    successLines: [
      "物理キー（USB）所持者：OneTown市民病院（EMS本部）の院長",
      "合言葉：えんどぅに頼まれて緊急アクセスキーを取りに来た"
    ]
  };
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b0c0e radial-gradient(ellipse at center, #1b1d22 0%, #050506 75%);
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
    color: #e8e8e8;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }

  /* ---------- モニター ---------- */
  .monitor { width: min(1100px, 100%); display: flex; flex-direction: column; align-items: center; }
  .bezel {
    width: 100%; position: relative;
    background: linear-gradient(#26282c, #17181b);
    border-radius: 14px; padding: 14px 14px 26px;
    box-shadow: 0 30px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .bezel::after {
    content: ""; position: absolute; bottom: 9px; right: 22px;
    width: 6px; height: 6px; border-radius: 50%;
    background: #3cff7a; box-shadow: 0 0 6px #3cff7a;
  }
  .brand { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 3px; color: #6b6f77; }
  .stand-neck { width: 90px; height: 40px; background: linear-gradient(#202226, #121315); }
  .stand-base { width: 240px; height: 12px; border-radius: 6px 6px 2px 2px; background: #1c1d20; box-shadow: 0 8px 18px rgba(0,0,0,.6); }

  /* ---------- 画面（暗めの壁紙） ---------- */
  .screen {
    position: relative; aspect-ratio: 16 / 9; width: 100%;
    overflow: hidden; border-radius: 4px;
    background:
      radial-gradient(ellipse 60% 35% at 50% 0%, rgba(255,170,60,.16), transparent 70%),
      repeating-linear-gradient(90deg, transparent 0 119px, rgba(255,255,255,.02) 119px 120px),
      linear-gradient(180deg, #1a1c20 0%, #121417 55%, #0a0b0d 100%);
  }
  .wallpaper-car { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); width: 58%; opacity: .25; pointer-events: none; }

  /* デスクトップ（ロック中はぼかし） */
  .desktop { position: absolute; inset: 0; transition: filter .6s; filter: blur(5px) brightness(.55); }
  .screen.unlocked .desktop { filter: none; }
  .icons { position: absolute; top: 2%; left: 1.5%; display: flex; flex-direction: column; gap: 10px; }
  .icon { width: 90px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; text-align: center; text-shadow: 0 1px 3px #000; }
  .icon svg { width: 40px; height: 40px; }

  /* ---------- タスクバー ---------- */
  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 40px; z-index: 5;
    background: rgba(20,21,24,.9); border-top: 1px solid rgba(255,255,255,.06);
    display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
  }
  .tray { display: flex; align-items: center; gap: 12px; font-size: 11px; color: #ddd; }
  .lock-state { display: flex; align-items: center; gap: 5px; color: #ff6b6b; }
  .screen.unlocked .lock-state { color: #3cff7a; }
  .clock { text-align: right; line-height: 1.3; }

  /* ---------- ログイン画面 ---------- */
  .overlay {
    position: absolute; inset: 0 0 40px 0; z-index: 4;
    display: flex; align-items: center; justify-content: center; padding: 14px;
    overflow-y: auto;
  }
  .panel {
    width: min(520px, 100%); margin: auto;
    background: rgba(18,20,24,.94); border: 1px solid #3a3c41; border-radius: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,.7); overflow: hidden;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel-head {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    background: #24262a; font-size: 12px; color: #ccc; border-bottom: 1px solid #333;
  }
  .panel-head svg { width: 16px; height: 16px; }
  .memo {
    margin: 14px 16px 0; padding: 10px 12px; border-radius: 6px;
    background: rgba(255,207,92,.08); border: 1px solid rgba(255,207,92,.55); border-left-width: 4px;
    color: #ffe3a3; font-size: 13px; line-height: 1.7;
  }
  .memo b { display: block; color: #ffcf5c; margin-bottom: 2px; }
  .login { padding: 18px 16px 20px; text-align: center; }
  .avatar {
    width: 64px; height: 64px; margin: 0 auto 8px; border-radius: 50%;
    background: #2b2e34; border: 2px solid #4ca3ff; display: grid; place-items: center;
  }
  .avatar svg { width: 32px; height: 32px; }
  .user { font-size: 16px; font-weight: 600; }
  .sub { font-size: 12px; color: #9aa0a8; margin: 2px 0 14px; }
  .field { display: flex; gap: 6px; max-width: 360px; margin: 0 auto; }
  .input-wrap { flex: 1; position: relative; min-width: 0; }
  .input-wrap input {
    width: 100%; height: 42px; padding: 0 40px 0 12px; border-radius: 6px;
    background: #0e0f12; border: 1px solid #4a4d55; color: #fff; font-size: 16px; outline: none;
    letter-spacing: 1px;
  }
  .input-wrap input:focus { border-color: #4ca3ff; box-shadow: 0 0 0 3px rgba(76,163,255,.25); }
  .eye {
    position: absolute; right: 4px; top: 4px; width: 34px; height: 34px;
    background: none; border: none; color: #9aa0a8; cursor: pointer; border-radius: 4px;
  }
  .eye:hover { color: #fff; background: rgba(255,255,255,.06); }
  .go {
    width: 46px; height: 42px; border-radius: 6px; border: none; cursor: pointer;
    background: #4ca3ff; color: #06121f; font-size: 20px; font-weight: 700;
  }
  .go:hover { background: #6db5ff; }
  .msg { min-height: 22px; margin-top: 10px; font-size: 13px; font-family: "Consolas", monospace; }
  .msg.err { color: #ff5d5d; text-shadow: 0 0 4px rgba(255,93,93,.5); }
  .msg.wait { color: #39ff7a; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }

  /* 成功画面 */
  .success { display: none; padding: 20px 16px 22px; text-align: center; }
  .screen.unlocked .login, .screen.unlocked .memo { display: none; }
  .screen.unlocked .success { display: block; }
  .screen.unlocked .panel { border-color: #ffe066; animation: pop .3s ease-out; }
  .check {
    width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 50%;
    background: rgba(60,255,122,.12); border: 2px solid #3cff7a; display: grid; place-items: center;
  }
  .success-box {
    margin-top: 6px; padding: 14px; border-radius: 6px; text-align: left;
    background: rgba(255,224,102,.06); border: 1px solid #ffe066;
    color: #ffe066; font-family: "Consolas", "MS Gothic", monospace; font-size: 14px; line-height: 1.9;
    text-shadow: 0 0 5px rgba(255,224,102,.35); user-select: text;
  }
  .success-box b { font-size: 16px; display: block; margin-bottom: 4px; }

  /* ---------- スマホ・狭い画面 ---------- */
  @media (max-width: 720px) {
    body { padding: 8px; align-items: stretch; }
    .monitor { height: 100%; }
    .bezel { flex: 1; display: flex; padding: 8px 8px 20px; border-radius: 10px; }
    .screen { aspect-ratio: auto; flex: 1; min-height: 0; }
    .stand-neck, .stand-base { display: none; }
    .icons { flex-direction: row; }
    .wallpaper-car { width: 90%; }
    .memo { font-size: 12.5px; }
  }
  @media (max-height: 560px) and (min-width: 721px) {
    .avatar { display: none; }
  }
</style>
</head>
<body>

<div class="monitor">
  <div class="bezel">
    <div class="screen" id="screen">

      <!-- 背景のデスクトップ -->
      <div class="desktop">
        <svg class="wallpaper-car" viewBox="0 0 600 200" fill="none" stroke="#ffb347" stroke-width="3" aria-hidden="true">
          <path d="M30 150 L40 115 Q60 100 130 95 L200 60 Q230 48 300 48 L380 50 Q420 54 460 90 L540 102 Q570 108 572 130 L575 150 Z" fill="rgba(255,179,71,.06)"/>
          <path d="M215 64 L300 56 L300 92 L170 95 Z M315 56 L375 58 Q405 62 440 92 L315 92 Z"/>
          <circle cx="140" cy="152" r="34" fill="#0d0e10"/><circle cx="140" cy="152" r="16"/>
          <circle cx="470" cy="152" r="34" fill="#0d0e10"/><circle cx="470" cy="152" r="16"/>
        </svg>
        <div class="icons" aria-hidden="true">
          <div class="icon"><svg viewBox="0 0 48 48"><rect x="9" y="5" width="30" height="38" rx="2" fill="#f4f4f4"/><rect x="9" y="5" width="30" height="7" fill="#4ca3ff"/></svg>整備作業日誌.txt</div>
          <div class="icon"><svg viewBox="0 0 48 48"><path d="M6 12 h14 l4 4 h18 v24 h-36 z" fill="#ffc83d"/></svg>顧客データ</div>
          <div class="icon"><svg viewBox="0 0 48 48"><path d="M12 14 h24 l-2.5 28 h-19 z" fill="rgba(200,220,255,.25)" stroke="#cfe0ff" stroke-width="2"/><rect x="9" y="9" width="30" height="5" rx="1.5" fill="#cfe0ff"/></svg>ゴミ箱</div>
        </div>
      </div>

      <!-- ログイン画面 -->
      <div class="overlay">
        <div class="panel" id="panel">
          <div class="panel-head">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffc83d" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            ガレージ・セキュリティ — ログイン
          </div>

          <div class="memo"><b id="memo-title"></b><span id="memo-text"></span></div>

          <form class="login" id="login" autocomplete="off">
            <div class="avatar"><svg viewBox="0 0 24 24" fill="#4ca3ff"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></div>
            <div class="user">GARAGE-ADMIN</div>
            <div class="sub">パスワードを入力して Enter</div>
            <div class="field">
              <div class="input-wrap">
                <input id="pw" type="password" placeholder="パスワード" aria-label="パスワード"
                       autocapitalize="off" autocorrect="off" spellcheck="false">
                <button type="button" class="eye" id="eye" title="パスワードを表示">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <button type="submit" class="go" title="ログイン">→</button>
            </div>
            <div class="msg" id="msg" role="status"></div>
          </form>

          <div class="success">
            <div class="check"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3cff7a" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></div>
            <div class="success-box" id="success-box"></div>
          </div>
        </div>
      </div>

      <!-- タスクバー -->
      <div class="taskbar">
        <svg width="18" height="18" viewBox="0 0 20 20"><rect width="9" height="9" fill="#4ca3ff"/><rect x="11" width="9" height="9" fill="#4ca3ff"/><rect y="11" width="9" height="9" fill="#4ca3ff"/><rect x="11" y="11" width="9" height="9" fill="#4ca3ff"/></svg>
        <div class="tray">
          <span class="lock-state" id="lock-state">● LOCKED</span>
          <span class="clock" id="clock"></span>
        </div>
      </div>

    </div>
    <div class="brand">MECHANIC-PC</div>
  </div>
  <div class="stand-neck"></div>
  <div class="stand-base"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const screen = $("screen"), panel = $("panel"), pw = $("pw"), msg = $("msg");

  // CONFIGのテキストを反映
  $("memo-title").textContent = CONFIG.memoTitle;
  $("memo-text").textContent = CONFIG.memoText;
  const box = $("success-box");
  const title = document.createElement("b");
  title.textContent = CONFIG.successTitle;
  box.appendChild(title);
  CONFIG.successLines.forEach(line => {
    const d = document.createElement("div");
    d.textContent = line;
    box.appendChild(d);
  });

  // パスワード表示切替
  $("eye").addEventListener("click", () => {
    pw.type = pw.type === "password" ? "text" : "password";
    pw.focus();
  });

  // ログイン判定
  $("login").addEventListener("submit", e => {
    e.preventDefault();
    const val = pw.value.trim();
    if (!val) { pw.focus(); return; }

    if (val === CONFIG.password) {
      pw.disabled = true;
      msg.className = "msg wait";
      msg.textContent = "認証中...";
      setTimeout(() => {
        screen.classList.add("unlocked");
        $("lock-state").textContent = "● UNLOCKED";
      }, 900);
    } else {
      msg.className = "msg err";
      msg.textContent = CONFIG.errorText;
      pw.value = "";
      panel.classList.remove("shake"); void panel.offsetWidth; panel.classList.add("shake");
      pw.focus();
    }
  });

  // 時計
  function tick() {
    const d = new Date();
    $("clock").innerHTML =
      d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) + "<br>" +
      d.toLocaleDateString("ja-JP");
  }
  tick(); setInterval(tick, 10000);
  pw.focus();
</script>
</body>
</html>
